name: Build macOS desktop
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            app_dir: mac-arm64
          - os: macos-15-intel
            arch: x64
            app_dir: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$RELEASE_TAG" = "v$(node -p 'require("./package.json").version')"
      - name: Install local simulators
        run: brew install icarus-verilog verilator
      - run: python -m pip install -r backend/requirements.txt
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run parser:bundle
      - name: Verify standalone parser
        run: |
          python - <<'PY'
          import json,subprocess,os
          result=subprocess.run(['build/parser/rtl-parser/rtl-parser'],input=json.dumps({'root':os.path.abspath('examples/vector_accelerator')}),text=True,capture_output=True,check=True)
          p=json.loads(result.stdout)
          assert p['ok'] and len(p['project']['instances']) == 30
          PY
      - name: UI checks
        run: |
          npx playwright install chromium --only-shell
          npm run test:ui
      - name: Package app
        run: npm run build && npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check package and checksums
        env:
          ARCH: ${{ matrix.arch }}
          APP_DIRECTORY: ${{ matrix.app_dir }}
        run: |
          codesign --verify --deep --strict "release/$APP_DIRECTORY/RTL Atlas.app"
          for image in release/*.dmg; do hdiutil verify "$image"; done
          cd release
          shasum -a 256 *.dmg *.zip > "SHA256SUMS-$ARCH.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: RTL-Atlas-mac-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/SHA256SUMS-*.txt
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: mac
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: RTL-Atlas-mac-*
          path: release
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > /tmp/release-draft; then
            test "$(cat /tmp/release-draft)" = true || { echo 'Refusing to overwrite a published release'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "RTL Atlas ${RELEASE_TAG#v}" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release/*.dmg release/*.zip release/*.blockmap release/SHA256SUMS-*.txt --clobber
